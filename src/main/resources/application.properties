# 判定阈值与综合分上限
typosquat.detection.suspicious-threshold=40
typosquat.detection.block-threshold=70
typosquat.detection.max-score=100

# 编辑距离特征
typosquat.detection.edit-distance.enabled=true
typosquat.detection.edit-distance.weight=40
typosquat.detection.edit-distance.max-distance=2

# 插入/删除特征
typosquat.detection.insert-delete.enabled=true
typosquat.detection.insert-delete.weight=30
typosquat.detection.insert-delete.max-distance=2

# 同形字符替换
typosquat.detection.homoglyph.enabled=true
typosquat.detection.homoglyph.weight=60

# 顶级域替换
typosquat.detection.tld-swap.enabled=true
typosquat.detection.tld-swap.weight=25

# 品牌词前后缀拼接
typosquat.detection.brand-affix.enabled=true
typosquat.detection.brand-affix.weight=70

# 子域伪装
typosquat.detection.subdomain-disguise.enabled=true
typosquat.detection.subdomain-disguise.weight=75

# 批量规模控制
typosquat.detection.batch.max-batch-size=100
typosquat.detection.batch.concurrency=4
typosquat.detection.batch.timeout-millis=5000

# 封禁与过期回收
typosquat.detection.ban.default-ttl-millis=86400000
typosquat.detection.ban.cleanup-interval-millis=60000

# 持久化目录（相对工作目录或绝对路径）
typosquat.detection.persistence.dir=data
