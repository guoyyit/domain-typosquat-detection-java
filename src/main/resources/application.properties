# 域名仿冒检测与封禁管理服务配置（前缀 domguard）

# 各特征权重（综合分数为命中权重之和，按高/中阈值分级）
domguard.edit-distance-weight=0.40
domguard.insert-delete-weight=0.35
domguard.homoglyph-weight=0.60
domguard.tld-swap-weight=0.30
domguard.brand-affix-weight=0.50
domguard.subdomain-disguise-weight=0.45

# 各特征触发阈值
domguard.edit-distance-threshold=2
domguard.insert-delete-threshold=1
domguard.homoglyph-threshold=1

# 判定分级阈值
domguard.high-score-threshold=0.80
domguard.medium-score-threshold=0.50

# 规模与资源约束
domguard.max-domain-length=253
domguard.max-batch-size=100
domguard.batch-concurrency=8
domguard.per-item-timeout-millis=5000

# 封禁与自动处置
domguard.block-ttl-millis=604800000
domguard.auto-block-enabled=true

# 持久化与历史容量
domguard.max-history-records=10000
domguard.data-dir=./data
